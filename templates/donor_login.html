<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Login - RayOfTrust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RayOfTrust</a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm">Home</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 mt-5">
                    <div class="card-header bg-white text-center py-4 border-0 border-bottom border-primary border-4">
                        <h3 class="mb-0 text-primary fw-bold">Donor Access Portal</h3>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                        <p class="text-muted text-center mb-4">Enter the email address you used when donating to view your impact and history.</p>
                        <form action="/donor_login" method="POST">
                            <div class="mb-4">
                                <label class="form-label fw-bold">Registered Email Address</label>
                                <input type="email" class="form-control form-control-lg" name="email" placeholder="e.g. john@example.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">View My Impact</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
