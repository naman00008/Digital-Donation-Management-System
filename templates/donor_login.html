<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Login - RayOfTrust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-hands-holding-heart me-2"></i>RayOfTrust</a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> Home</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 mt-4">
                    <div class="card-header bg-white text-center py-4 border-0 border-bottom border-primary border-4">
                        <h3 class="mb-0 text-primary fw-bold">Donor Access Portal</h3>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                        <p class="text-muted text-center mb-4">Log in with your registered email and password to view your donations, celebrations, and tax receipts.</p>
                        <form action="/donor_login" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Registered Email Address</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" class="form-control" name="email" placeholder="e.g. john@example.com" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Password</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Log In to Donor Portal
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
