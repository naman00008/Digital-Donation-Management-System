<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RayOfTrust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RayOfTrust</a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm">Home</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 mt-5">
                    <div class="card-header bg-dark text-white text-center py-4 border-0">
                        <h3 class="mb-0">Secure Admin Login</h3>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Admin Username</label>
                                <input type="text" class="form-control" name="username" placeholder="Enter 'admin'" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="Enter 'admin123'" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold">Login to Dashboard</button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-muted mt-3 small">For this prototype demonstration, use <strong>admin / admin123</strong></p>
            </div>
        </div>
    </div>
</body>
</html>
