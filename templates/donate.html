<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - RayOfTrust</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Industry Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .checkout-container { max-width: 950px; margin: 40px auto; }
        
        /* Stunning Razorpay-style Gateway Layout */
        #payment-gateway { 
            display: none; 
            background: white; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border: 1px solid #e9ecef;
        }
        
        .payment-sidebar { background: #f8f9fa; border-right: 1px solid #e9ecef; padding: 0; display: flex; flex-direction: column; }
        
        .payment-sidebar .nav-link { 
            color: #495057; border-radius: 0; padding: 18px 24px; border-left: 4px solid transparent; 
            font-weight: 500; font-size: 0.95rem; text-align: left; transition: all 0.2s;
        }
        .payment-sidebar .nav-link:hover { background: #e9ecef; }
        .payment-sidebar .nav-link.active { 
            background: white; color: #0d6efd; border-left-color: #0d6efd; font-weight: 700; box-shadow: -5px 0 10px rgba(0,0,0,0.02);
        }
        .payment-sidebar .nav-link i { width: 28px; text-align: center; margin-right: 12px; font-size: 1.1rem; }
        
        .payment-content { padding: 50px 60px; position: relative; min-height: 500px; }
        
        .form-control-custom { 
            background: #fff; border: 1.5px solid #ced4da; padding: 14px 18px; border-radius: 10px; font-size: 1rem; transition: 0.3s;
        }
        .form-control-custom:focus { border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13,110,253,0.1); }
        
        /* Processing Overlay */
        #processing-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center;
            border-radius: 0 16px 16px 0;
        }
        .bank-loader { 
            width: 60px; height: 60px; border: 5px solid #f3f3f3; border-top: 5px solid #0d6efd; 
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-hands-holding-child me-2"></i>RayOfTrust</a>
            <div class="d-flex">
                <a href="/donor" class="btn btn-light btn-sm fw-bold me-2">Donor Portal</a>
                <a href="/admin" class="btn btn-outline-light btn-sm">Admin</a>
            </div>
        </div>
    </nav>

    <div class="checkout-container px-3">
        <!-- Step 1: Donation Details (Redesigned) -->
        <div class="card shadow border-0 rounded-4 mb-4" id="donation-details">
            <div class="card-header bg-white text-center py-5 border-0">
                <h2 class="fw-bold text-dark mb-2">Complete Your Donation</h2>
                <p class="text-muted fs-5">Your secure contribution is 80G tax-exempt.</p>
            </div>
            <div class="card-body p-4 p-md-5 pt-0">
                <form id="donationForm" action="/create-checkout-session" method="POST">
                    <input type="hidden" name="payment_method" id="payment_method" value="Online">
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Full Name</label>
                            <input type="text" class="form-control form-control-custom" name="donor_name" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Email Address</label>
                            <input type="email" class="form-control form-control-custom" name="donor_email" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Phone Number (Optional)</label>
                            <input type="text" class="form-control form-control-custom" name="donor_phone" placeholder="+91">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Create a Password (Optional)</label>
                            <input type="password" class="form-control form-control-custom" name="donor_password" placeholder="To track your impact">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Donation Amount</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 fw-bold fs-5 px-4 text-muted">₹</span>
                                <input type="number" class="form-control form-control-custom border-start-0 ps-0 fs-5 fw-bold" name="amount" placeholder="5000" min="10" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-5">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Select Campaign</label>
                            <select class="form-select form-control-custom" name="purpose" required>
                                <option value="General Fund">General Fund (Greatest Need)</option>
                                <option value="Education Drive">Education Drive</option>
                                <option value="Winter Clothes">Winter Clothes Distribution</option>
                                <option value="Medical Relief">Medical Relief Fund</option>
                                <option value="Women Empowerment">Women Empowerment Program</option>
                                <option value="Hunger Relief">Hunger Relief & Food Drives</option>
                                <option value="Clean Water">Clean Water Initiative</option>
                                <option value="Orphanage Support">Orphanage Support</option>
                                <option value="Skill Development">Skill Development Program</option>
                                <option value="Disaster Relief">Disaster Relief Fund</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold fs-5 shadow">Proceed to Official Stripe Checkout <i class="fa-solid fa-lock ms-2"></i></button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
